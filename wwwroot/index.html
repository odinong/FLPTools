<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLPTools</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="titlebar"></div>
<div id="bg"><canvas id="fx"></canvas><div class="layer"></div><div class="layer"></div><div class="shade"></div></div>
<div id="app" hidden>

  <div class="rail" id="rail"></div>
  <section class="hero" id="hero"></section>
  <div class="cards" id="cards"></div>
  <footer class="hints" id="hints"></footer>

<div id="pages"></div>
<div id="launchFx" hidden></div>
<div id="toasts"></div>

<script src="fx.js"></script>
<script src="app.js"></script>

</html>
